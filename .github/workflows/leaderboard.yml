name: Leaderboard

# Regenerate the public leaderboard on a schedule and on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC

jobs:
  leaderboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install mcp-grade
        run: python -m pip install -e .

      - name: Generate leaderboard
        run: |
          mcp-grade-leaderboard --from-file leaderboard/repos.txt \
            --json leaderboard.json --html leaderboard.html --md leaderboard.md

      - name: Upload leaderboard artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcp-grade-leaderboard
          path: |
            leaderboard.json
            leaderboard.html
            leaderboard.md
