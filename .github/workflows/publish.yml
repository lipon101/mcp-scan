name: Publish to PyPI

# Builds and publishes mcp-scan to PyPI whenever a GitHub Release is created.
# Uses PyPI "trusted publishing" (OIDC) — NO long-lived API token needed.
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   Owner: lipon101   Repository: mcp-scan   Workflow: publish.yml   Environment: pypi

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tooling
        run: python -m pip install --upgrade build
      - name: Build sdist + wheel
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        # No password input — authenticates via the OIDC trusted publisher.
