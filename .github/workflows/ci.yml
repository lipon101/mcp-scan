name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install (from source)
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Dogfood — scan the good example (must pass the gate)
        run: python -m mcp_grade.cli examples/good_server --fail-under B --report -o good-report.md

      - name: Dogfood — confirm the bad example FAILS the gate
        run: |
          if python -m mcp_grade.cli examples/bad_server --fail-under B; then
            echo "ERROR: bad_server should have failed the gate"; exit 1
          else
            echo "OK: bad_server correctly failed the gate"
          fi
